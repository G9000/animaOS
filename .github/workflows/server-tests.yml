name: Server Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite is ~3200 tests and anima-core is a maturin (Rust) workspace
    # member built by uv on first sync; a cold cache needs the headroom.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # anima-core is a maturin workspace member; uv builds it from source,
      # and tests/conftest.py fails fast if the native module is stale.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      # AGENTS.md's prescribed environment: --all-extras is required — it
      # pulls the docling extra (the only durable PDF parser), and a plain
      # sync/run would prune it, gating the suite on a degraded no-parser
      # environment instead of the supported one.
      - name: Sync workspace (all packages, all extras)
        run: uv sync --locked --all-packages --all-extras

      - name: Run pytest
        working-directory: apps/server
        # --no-sync: `uv run` would otherwise re-sync default-only deps and
        # prune the docling extra installed above. The suite is hermetic by
        # construction (tests/conftest.py pins the passphrase, embedding,
        # and reranker seams), so no secrets or model downloads.
        run: uv run --locked --no-sync pytest -q
