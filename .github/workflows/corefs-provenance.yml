name: CoreFS provenance

on:
  pull_request:
    paths:
      - "packages/anima-file-tools/**"
      - "packages/anima-corefs/**"
      - "packages/anima-core/**"
      - "apps/animus/**"
      - "apps/server/src/anima_server/services/sessions.py"
      - "apps/server/src/anima_server/services/corefs/**"
      - "apps/server/src/anima_server/services/agent/**"
      - "apps/server/src/anima_server/api/deps/unlock.py"
      - "apps/server/src/anima_server/api/routes/**"
      - "apps/server/src/anima_server/api/ws/**"
      - "apps/server/src/anima_server/main.py"
      - "apps/server/tests/test_dev_session_continuity.py"
      - "apps/server/tests/test_corefs_api.py"
      - "apps/server/tests/test_corefs_logical.py"
      - "apps/server/tests/test_corefs_catalog_benchmark.py"
      - "apps/server/tests/test_ws.py"
      - "apps/server/tests/test_runtime_db.py"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/**"
      - "scripts/check_codex_attribution.py"
      - "scripts/check_corefs_release_notices.py"
      - "scripts/prepare-desktop-release.ts"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/corefs-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout animaOS only
        uses: actions/checkout@v4

      - name: Assert there is no sibling Codex checkout
        shell: bash
        run: >-
          test -z "$(find .. -mindepth 1 -maxdepth 1 -type d -name codex -print -quit)"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install shared-crate MSRV toolchain
        run: rustup toolchain install 1.75.0 --profile minimal

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Validate attribution and repository-local dependencies
        run: python3 scripts/check_codex_attribution.py

      - name: Validate locked Cargo metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Test shared file tools on Rust 1.75
        run: cargo +1.75.0 test --locked -p anima-file-tools

      - name: Test CoreFS on Rust 1.75
        run: cargo +1.75.0 test --locked -p anima-corefs

      - name: Test HostFS adapter on repository stable Rust
        run: cargo test --locked -p animus

      - name: Stage release legal resources only
        run: bun run scripts/prepare-desktop-release.ts --legal-only

      - name: Validate staged release notices
        run: >-
          python3 scripts/check_corefs_release_notices.py
          --release-root apps/desktop/src-tauri/resources/.anima

  windows-native-lease:
    runs-on: windows-latest
    steps:
      - name: Checkout animaOS
        uses: actions/checkout@v4

      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal --component clippy

      - name: Prove constant-space terminal event flood
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          transaction::object_lease_tests::windows_object_lease_tests::windows_event_flood_is_constant_space_and_terminal
          -- --exact --nocapture

      - name: Prove exact three-resource monitor plan
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          transaction::object_lease_tests::windows_object_lease_tests::windows_resource_plan_matches_three_live_monitor_resources
          -- --exact --nocapture

      - name: Prove target miss retains ownership until completion
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          transaction::object_lease_tests::windows_object_lease_tests::windows_teardown_target_miss_retains_ownership_until_completion
          -- --exact --nocapture

      - name: Prove supported NTFS cancellation and join target
        run: >-
          cargo +1.75.0 test --locked -p anima-core --features python
          windows_supported_profile_teardown_meets_target -- --nocapture

      - name: Prove production counters, zero resource delta, and residue
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          --test catalog_benchmark lease -- --nocapture

      - name: Prove Windows production link-count rejection
        run: >-
          cargo +1.75.0 test --release --locked -p anima-corefs
          --test transaction production_link_count -- --nocapture

      - name: Test all CoreFS paths on Windows
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          -- --test-threads=1

      - name: Enforce strict native Clippy
        run: >-
          cargo +1.75.0 clippy --locked -p anima-corefs -p anima-core
          --all-targets --all-features -- -D warnings

  macos-native-lease:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Checkout animaOS
        uses: actions/checkout@v4

      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal --component clippy

      - name: Build clean macOS characterization harness
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          cargo +1.75.0 build --release --locked -p anima-corefs \
            --bin object_lease_macos_spike

      - name: Run exact macOS lease performance characterization
        shell: bash
        run: |
          test ! -e /tmp/corefs-object-lease-macos.json
          ./target/release/object_lease_macos_spike \
            --objects 2500 \
            --warmups 30 \
            --samples 200 \
            --output /tmp/corefs-object-lease-macos.json

      - name: Run exact APFS restored-path characterization
        shell: bash
        run: |
          test ! -e /tmp/corefs-object-lease-macos-races.json
          ./target/release/object_lease_macos_spike \
            --objects 2500 \
            --race-samples 200 \
            --mount-restored-path \
            --output /tmp/corefs-object-lease-macos-races.json

      - name: Validate closed macOS characterization evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import pathlib
          import subprocess

          ROOT = pathlib.Path.cwd()
          SOURCE = ROOT / "packages/anima-corefs/src/bin/object_lease_macos_spike.rs"
          LOCK = ROOT / "Cargo.lock"
          HEAD = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          RUSTC = subprocess.check_output(
              ["rustc", "+1.75.0", "--version"], text=True
          ).strip()
          RUSTC_VERBOSE = subprocess.check_output(
              ["rustc", "+1.75.0", "-vV"], text=True
          ).splitlines()
          TARGET = next(
              line.removeprefix("host: ")
              for line in RUSTC_VERBOSE
              if line.startswith("host: ")
          )

          TOP_KEYS = {
              "schemaVersion", "platform", "hardware", "os", "filesystem",
              "build", "objectCount", "sampling", "safeOpen", "lease",
              "resources", "lifecycle", "restoredPath", "outcomes",
              "orderedBoundaryProven",
          }
          BUILD_KEYS = {
              "profile", "rustc", "sourceCommit", "trackedTreeClean",
              "targetTriple", "spikeSource", "cargoLock", "argv",
          }
          DISTRIBUTION_KEYS = {"p50Ms", "p95Ms", "p99Ms"}
          PERFORMANCE_ARGV = [
              "--objects", "2500", "--warmups", "30", "--samples", "200",
              "--output", "/tmp/corefs-object-lease-macos.json",
          ]
          RACE_ARGV = [
              "--objects", "2500", "--race-samples", "200",
              "--mount-restored-path", "--output",
              "/tmp/corefs-object-lease-macos-races.json",
          ]

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git_blob(path):
              return subprocess.check_output(
                  ["git", "hash-object", "--no-filters", str(path)], text=True
              ).strip()

          def exact_keys(value, expected, label):
              assert isinstance(value, dict), (label, value)
              assert set(value) == expected, (label, set(value), expected)

          def validate_distribution(value, label):
              exact_keys(value, DISTRIBUTION_KEYS, label)
              samples = [value["p50Ms"], value["p95Ms"], value["p99Ms"]]
              assert all(
                  isinstance(sample, (int, float))
                  and not isinstance(sample, bool)
                  and math.isfinite(sample)
                  and sample >= 0
                  for sample in samples
              ), (label, samples)
              assert samples == sorted(samples), (label, samples)

          def validate(path, mode, argv):
              report = json.loads(pathlib.Path(path).read_text())
              exact_keys(report, TOP_KEYS, "report")
              assert report["schemaVersion"] == 2
              assert report["platform"] == "macos"
              assert report["objectCount"] == 2500

              exact_keys(report["hardware"], {"model", "architecture"}, "hardware")
              exact_keys(report["os"], {"version", "build"}, "os")
              assert all(report["hardware"].values())
              assert all(report["os"].values())
              exact_keys(report["filesystem"], {"name", "mountPath"}, "filesystem")
              assert report["filesystem"]["name"].casefold() == "apfs"
              assert report["filesystem"]["mountPath"]

              build = report["build"]
              exact_keys(build, BUILD_KEYS, "build")
              assert build["profile"] == "release"
              assert build["rustc"] == RUSTC
              assert build["sourceCommit"] == HEAD
              assert build["trackedTreeClean"] is True
              assert build["targetTriple"] == TARGET
              assert build["argv"] == argv, (build["argv"], argv)
              for artifact, source in (
                  (build["spikeSource"], SOURCE),
                  (build["cargoLock"], LOCK),
              ):
                  exact_keys(artifact, {"sha256", "gitBlob"}, "build artifact")
                  assert artifact["sha256"] == sha256(source)
                  assert artifact["gitBlob"] == git_blob(source)

              validate_distribution(report["safeOpen"], "safeOpen")
              validate_distribution(report["lease"], "lease")
              exact_keys(
                  report["resources"],
                  {
                      "maximumDescriptorDelta",
                      "postTeardownDescriptorDelta",
                      "residueCount",
                  },
                  "resources",
              )
              assert 0 <= report["resources"]["maximumDescriptorDelta"] <= 65
              assert report["resources"]["postTeardownDescriptorDelta"] == 0
              assert report["resources"]["residueCount"] == 0

              exact_keys(
                  report["lifecycle"],
                  {
                      "creationPassed", "startPassed", "callbackPanicContained",
                      "teardownPassed", "callbackAfterRelease",
                  },
                  "lifecycle",
              )
              assert report["lifecycle"] == {
                  "creationPassed": True,
                  "startPassed": True,
                  "callbackPanicContained": True,
                  "teardownPassed": True,
                  "callbackAfterRelease": False,
              }
              exact_keys(
                  report["outcomes"],
                  {
                      "ordinaryEventsDirtyAll", "ambiguousFlagsUnknown",
                      "outsideHardLinkRejected",
                  },
                  "outcomes",
              )
              assert all(report["outcomes"].values())
              exact_keys(
                  report["restoredPath"],
                  {
                      "tested", "ancestorAboveVolumeCovered",
                      "zeroIdRootChangedRejectedClean",
                  },
                  "restoredPath",
              )

              sampling = report["sampling"]
              if mode == "performance":
                  assert sampling == {
                      "mode": "performance", "warmups": 30, "samples": 200
                  }
                  for percentile in ("p50Ms", "p95Ms", "p99Ms"):
                      assert (
                          report["lease"][percentile]
                          < report["safeOpen"][percentile]
                      ), (
                          percentile,
                          report["lease"][percentile],
                          report["safeOpen"][percentile],
                      )
                  assert report["restoredPath"] == {
                      "tested": False,
                      "ancestorAboveVolumeCovered": False,
                      "zeroIdRootChangedRejectedClean": False,
                  }
                  assert report["orderedBoundaryProven"] is False
              else:
                  assert sampling == {
                      "mode": "restoredPathRace", "raceSamples": 200
                  }
                  assert all(report["restoredPath"].values())
                  assert report["orderedBoundaryProven"] is True

          validate(
              "/tmp/corefs-object-lease-macos.json",
              "performance",
              PERFORMANCE_ARGV,
          )
          validate(
              "/tmp/corefs-object-lease-macos-races.json",
              "restoredPathRace",
              RACE_ARGV,
          )
          PY

      - name: Upload macOS characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corefs-macos-native-lease-${{ github.sha }}
          path: |
            /tmp/corefs-object-lease-macos.json
            /tmp/corefs-object-lease-macos-races.json
          if-no-files-found: warn
          retention-days: 14

      - name: Detect enabled macOS native backend
        id: macos-backend
        shell: bash
        run: |
          if test -f packages/anima-corefs/src/transaction/object_lease/macos.rs; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run exact macOS FSEvents and kqueue integration
        if: steps.macos-backend.outputs.enabled == 'true'
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          --test object_lease_macos -- --nocapture

      - name: Run macOS lease unit contract
        if: steps.macos-backend.outputs.enabled == 'true'
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          macos_object_lease -- --nocapture

      - name: Test all CoreFS paths on macOS
        if: steps.macos-backend.outputs.enabled == 'true'
        run: cargo +1.75.0 test --locked -p anima-corefs

      - name: Enforce strict native Clippy
        if: steps.macos-backend.outputs.enabled == 'true'
        run: >-
          cargo +1.75.0 clippy --locked -p anima-corefs -p anima-core
          --all-targets --all-features -- -D warnings
