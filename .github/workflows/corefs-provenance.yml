name: CoreFS provenance

on:
  pull_request:
    paths:
      - "packages/anima-file-tools/**"
      - "packages/anima-corefs/**"
      - "packages/anima-core/**"
      - "apps/animus/**"
      - "apps/server/src/anima_server/services/sessions.py"
      - "apps/server/src/anima_server/services/corefs/**"
      - "apps/server/src/anima_server/services/agent/**"
      - "apps/server/src/anima_server/api/deps/unlock.py"
      - "apps/server/src/anima_server/api/routes/**"
      - "apps/server/src/anima_server/api/ws/**"
      - "apps/server/src/anima_server/main.py"
      - "apps/server/tests/test_dev_session_continuity.py"
      - "apps/server/tests/test_corefs_api.py"
      - "apps/server/tests/test_corefs_logical.py"
      - "apps/server/tests/test_corefs_catalog_benchmark.py"
      - "apps/server/tests/test_ws.py"
      - "apps/server/tests/test_runtime_db.py"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/**"
      - "scripts/check_codex_attribution.py"
      - "scripts/check_corefs_release_notices.py"
      - "scripts/prepare-desktop-release.ts"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/corefs-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout animaOS only
        uses: actions/checkout@v4

      - name: Assert there is no sibling Codex checkout
        shell: bash
        run: >-
          test -z "$(find .. -mindepth 1 -maxdepth 1 -type d -name codex -print -quit)"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install shared-crate MSRV toolchain
        run: rustup toolchain install 1.75.0 --profile minimal

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Validate attribution and repository-local dependencies
        run: python3 scripts/check_codex_attribution.py

      - name: Validate locked Cargo metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Test shared file tools on Rust 1.75
        run: cargo +1.75.0 test --locked -p anima-file-tools

      - name: Test CoreFS on Rust 1.75
        run: cargo +1.75.0 test --locked -p anima-corefs

      - name: Test HostFS adapter on repository stable Rust
        run: cargo test --locked -p animus

      - name: Stage release legal resources only
        run: bun run scripts/prepare-desktop-release.ts --legal-only

      - name: Validate staged release notices
        run: >-
          python3 scripts/check_corefs_release_notices.py
          --release-root apps/desktop/src-tauri/resources/.anima

  windows-native-lease:
    runs-on: windows-latest
    steps:
      - name: Checkout animaOS
        uses: actions/checkout@v4

      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal --component clippy

      - name: Prove constant-space terminal event flood
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          transaction::object_lease_tests::windows_object_lease_tests::windows_event_flood_is_constant_space_and_terminal
          -- --exact --nocapture

      - name: Prove exact three-resource monitor plan
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          transaction::object_lease_tests::windows_object_lease_tests::windows_resource_plan_matches_three_live_monitor_resources
          -- --exact --nocapture

      - name: Prove target miss retains ownership until completion
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          transaction::object_lease_tests::windows_object_lease_tests::windows_teardown_target_miss_retains_ownership_until_completion
          -- --exact --nocapture

      - name: Prove supported NTFS cancellation and join target
        run: >-
          cargo +1.75.0 test --locked -p anima-core --features python
          windows_supported_profile_teardown_meets_target -- --nocapture

      - name: Prove production counters, zero resource delta, and residue
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          --test catalog_benchmark lease -- --nocapture

      - name: Prove Windows production link-count rejection
        run: >-
          cargo +1.75.0 test --release --locked -p anima-corefs
          --test transaction production_link_count -- --nocapture

      - name: Test all CoreFS paths on Windows
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          -- --test-threads=1

      - name: Enforce strict native Clippy
        run: >-
          cargo +1.75.0 clippy --locked -p anima-corefs -p anima-core
          --all-targets --all-features -- -D warnings

  macos-native-lease:
    runs-on: macos-latest
    steps:
      - name: Checkout animaOS
        uses: actions/checkout@v4

      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal --component clippy

      - name: Prove macOS characterization starts RED
        shell: bash
        run: |
          cargo +1.75.0 build --release --locked -p anima-corefs \
            --bin object_lease_macos_spike

          set +e
          diagnostic="$(
            ./target/release/object_lease_macos_spike \
              --objects 2500 \
              --warmups 30 \
              --samples 200 \
              --output /tmp/corefs-object-lease-macos.json 2>&1
          )"
          status=$?
          set -e
          printf '%s\n' "$diagnostic"
          test "$status" -eq 1
          printf '%s\n' "$diagnostic" | python3 -c '
          import json
          import sys

          diagnostic = json.load(sys.stdin)
          expected = {
              "error": "backendUnavailable",
              "message": (
                  "the native macOS FSEvents/kqueue characterization backend "
                  "is not implemented"
              ),
          }
          assert diagnostic == expected, diagnostic
          '
          test ! -e /tmp/corefs-object-lease-macos.json

      - name: Detect enabled macOS native backend
        id: macos-backend
        shell: bash
        run: |
          if test -f packages/anima-corefs/src/transaction/object_lease/macos.rs; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run exact macOS FSEvents and kqueue integration
        if: steps.macos-backend.outputs.enabled == 'true'
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          --test object_lease_macos -- --nocapture

      - name: Run macOS lease unit contract
        if: steps.macos-backend.outputs.enabled == 'true'
        run: >-
          cargo +1.75.0 test --locked -p anima-corefs
          macos_object_lease -- --nocapture

      - name: Test all CoreFS paths on macOS
        if: steps.macos-backend.outputs.enabled == 'true'
        run: cargo +1.75.0 test --locked -p anima-corefs

      - name: Enforce strict native Clippy
        if: steps.macos-backend.outputs.enabled == 'true'
        run: >-
          cargo +1.75.0 clippy --locked -p anima-corefs -p anima-core
          --all-targets --all-features -- -D warnings
