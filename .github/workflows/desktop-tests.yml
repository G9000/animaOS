name: Desktop Tests

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      # Workspace packages the desktop app imports directly — a breaking
      # change in any of them surfaces as a desktop typecheck/build failure.
      - "packages/api-client/**"
      - "packages/standard-templates/**"
      - "packages/ascii-motion/**"
      - "packages/anima-runtime-daemon-contracts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck, unit tests, and the production build — the three gates
      # that previously ran only on a developer's machine (RWF-008). The
      # desktop app has no Rust or Python dependency, so no toolchain beyond
      # Bun is needed and the job stays fast.
      - name: Typecheck
        working-directory: apps/desktop
        run: bunx tsc --noEmit

      - name: Unit tests
        working-directory: apps/desktop
        run: bun test tests/

      - name: Build
        working-directory: apps/desktop
        run: bun run build
