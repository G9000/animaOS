name: desktop-draft-cleanup-authority

# COST_DISABLED: the user deferred this four-platform evidence run. Keep the
# reviewed workflow definition below, but expose no GitHub Actions trigger until
# funding and separate execution authority are available.
on: []

# Re-enable only with explicit user authority:
# on:
#   workflow_dispatch:
#     inputs:
#       fixture_version:
#         description: Unpublished predecessor version built from this same protected source tag
#         required: true
#         default: 0.0.1

permissions:
  contents: read

env:
  ANIMA_REQUIRE_NATIVE_BOOT_IDENTITY_TEST: "1"

jobs:
  verify-package-upgrade:
    if: github.ref_type == 'tag' && github.ref_protected == true && startsWith(github.ref_name, 'desktop-v')
    environment: desktop-release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            extension: .msi
          - platform: macos
            os: macos-latest
            extension: .pkg
          - platform: debian
            os: ubuntu-latest
            extension: .deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout exact current source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Prove first-release bootstrap boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/desktop-v" --jq '.[].ref' | sort > desktop-release-refs.txt
          test "$(wc -l < desktop-release-refs.txt | tr -d ' ')" -eq 1
          test "$(cat desktop-release-refs.txt)" = "refs/tags/$GITHUB_REF_NAME"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].assets[].name' | sort > desktop-release-assets.txt
          if grep -Eiq '\.(msi|pkg|deb|rpm)$' desktop-release-assets.txt; then
            echo "A prior installer-managed desktop host exists; bootstrap fixture is invalid" >&2
            exit 1
          fi

      - name: Install Debian package dependencies
        if: matrix.platform == 'debian'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          openssl procps xvfb xauth

      - name: Configure signed cross-version host identity
        shell: bash
        env:
          PRIVATE_KEY_PEM: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PRIVATE_KEY_PEM }}
          PUBLIC_KEY_PEM: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PUBLIC_KEY_PEM }}
          PUBLIC_KEY_HEX: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PUBLIC_KEY_HEX }}
          PREVIOUS_PUBLIC_KEY_PEM: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_PEM }}
          PREVIOUS_PRIVATE_KEY_PEM: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PREVIOUS_PRIVATE_KEY_PEM }}
          PREVIOUS_PUBLIC_KEY_HEX: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_HEX }}
        run: |
          test -n "$PRIVATE_KEY_PEM"
          test -n "$PUBLIC_KEY_PEM"
          test -n "$PUBLIC_KEY_HEX"
          test -n "$PREVIOUS_PUBLIC_KEY_PEM"
          test -n "$PREVIOUS_PRIVATE_KEY_PEM"
          test -n "$PREVIOUS_PUBLIC_KEY_HEX"
          : > "$RUNNER_TEMP/anima-install-identity-private.pem"
          : > "$RUNNER_TEMP/anima-install-identity-public.pem"
          : > "$RUNNER_TEMP/anima-install-identity-previous-public.pem"
          : > "$RUNNER_TEMP/anima-install-identity-previous-private.pem"
          printf '%s' "$PRIVATE_KEY_PEM" > "$RUNNER_TEMP/anima-install-identity-private.pem"
          printf '%s' "$PUBLIC_KEY_PEM" > "$RUNNER_TEMP/anima-install-identity-public.pem"
          printf '%s' "$PREVIOUS_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/anima-install-identity-previous-public.pem"
          printf '%s' "$PREVIOUS_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/anima-install-identity-previous-private.pem"
          chmod 600 "$RUNNER_TEMP/anima-install-identity-private.pem" "$RUNNER_TEMP/anima-install-identity-previous-private.pem"
          test "$PUBLIC_KEY_HEX" != "$PREVIOUS_PUBLIC_KEY_HEX"
          echo "ANIMA_INSTALL_IDENTITY_PRIVATE_KEY=$RUNNER_TEMP/anima-install-identity-private.pem" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PUBLIC_KEY_PEM=$RUNNER_TEMP/anima-install-identity-public.pem" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_PEM=$RUNNER_TEMP/anima-install-identity-previous-public.pem" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PREVIOUS_PRIVATE_KEY=$RUNNER_TEMP/anima-install-identity-previous-private.pem" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_HEX=$PREVIOUS_PUBLIC_KEY_HEX" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PUBLIC_KEY_HEX=$PUBLIC_KEY_HEX" >> "$GITHUB_ENV"

      - name: Import Windows Authenticode certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.ANIMA_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.ANIMA_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) { throw "Windows signing secrets are required" }
          $pfx = Join-Path $env:RUNNER_TEMP "anima-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "ANIMA_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "ANIMA_WINDOWS_TIMESTAMP_URL=https://timestamp.digicert.com" >> $env:GITHUB_ENV

      - name: Import macOS application and installer identities
        if: matrix.platform == 'macos'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.ANIMA_MAC_CERTIFICATES_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ANIMA_MAC_CERTIFICATES_PASSWORD }}
          APP_IDENTITY: ${{ secrets.ANIMA_MAC_APPLICATION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.ANIMA_MAC_INSTALLER_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.ANIMA_MAC_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.ANIMA_MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ANIMA_MAC_NOTARY_ISSUER }}
        run: |
          for value in "$P12_BASE64" "$P12_PASSWORD" "$APP_IDENTITY" "$INSTALLER_IDENTITY" "$NOTARY_KEY_BASE64" "$NOTARY_KEY_ID" "$NOTARY_ISSUER"; do test -n "$value"; done
          keychain="$RUNNER_TEMP/anima-build.keychain-db"
          p12="$RUNNER_TEMP/anima-certificates.p12"
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$P12_BASE64" | base64 -D > "$p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
          security create-keychain -p "$P12_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$P12_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials ANIMA-ci --key "$notary_key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          echo "APPLE_SIGNING_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "ANIMA_MAC_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "ANIMA_MAC_NOTARY_PROFILE=ANIMA-ci" >> "$GITHUB_ENV"

      - name: Install current dependencies
        run: bun install --frozen-lockfile

      - name: Validate protected release and predecessor versions
        shell: bash
        env:
          FIXTURE_VERSION: ${{ inputs.fixture_version }}
        run: |
          current_version=$(bun -e 'console.log(JSON.parse(await Bun.file("apps/desktop/src-tauri/tauri.conf.json").text()).version)')
          test "$GITHUB_REF_NAME" = "desktop-v$current_version"
          CURRENT_VERSION="$current_version" bun -e 'if (Bun.semver.order(process.env.FIXTURE_VERSION, process.env.CURRENT_VERSION) >= 0) process.exit(1)'

      - name: Build unpublished predecessor fixture from the same protected source
        shell: bash
        env:
          ANIMA_DESKTOP_VERSION_OVERRIDE: ${{ inputs.fixture_version }}
          ANIMA_DRAFT_CLEANUP_LEGACY_FIXTURE: "1"
        run: |
          export ANIMA_INSTALL_IDENTITY_PRIVATE_KEY="$ANIMA_INSTALL_IDENTITY_PREVIOUS_PRIVATE_KEY"
          export ANIMA_INSTALL_IDENTITY_PUBLIC_KEY_HEX="$ANIMA_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_HEX"
          bun run --cwd apps/desktop package:${{ matrix.platform }}
          if [ "${{ matrix.platform }}" = macos ]; then
            find target -path '*/bundle/pkg/ANIMA.pkg' -type f > previous-artifacts.txt
          else
            find target -name '*${{ matrix.extension }}' -type f > previous-artifacts.txt
          fi
          test "$(wc -l < previous-artifacts.txt | tr -d ' ')" -eq 1
          previous="$RUNNER_TEMP/anima-predecessor${{ matrix.extension }}"
          mv "$(cat previous-artifacts.txt)" "$previous"
          printf '%s\n' "$previous" > previous-artifact.txt

      - name: Build exact signed current artifact
        run: bun run --cwd apps/desktop package:${{ matrix.platform }}

      - name: Locate exactly one final artifact per version
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then
            find target -path '*/bundle/pkg/ANIMA.pkg' -type f > current-artifacts.txt
          else
            find target -name '*${{ matrix.extension }}' -type f > current-artifacts.txt
          fi
          test "$(wc -l < current-artifacts.txt | tr -d ' ')" -eq 1
          mv current-artifacts.txt current-artifact.txt

      - name: Install replacement and inspect native registrations
        shell: bash
        run: >-
          bun run scripts/verify-desktop-release-contract.ts
          --platform ${{ matrix.platform }}
          --previous-artifact "$(cat previous-artifact.txt)"
          --artifact "$(cat current-artifact.txt)"
          --output artifact-digests

      - name: Native launch gate, boot identity, and process census primitives
        run: cargo test -p desktop --test draft_cleanup_process

      - name: Strict native authority lint
        run: cargo clippy -p desktop --all-targets -- -D warnings

      - name: Collect verified final artifact
        shell: bash
        run: cp "$(cat current-artifact.txt)" artifact-digests/

      - name: Upload verified artifact and evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-anima-${{ matrix.platform }}
          path: artifact-digests
          if-no-files-found: error

  verify-rpm-upgrade:
    if: github.ref_type == 'tag' && github.ref_protected == true && startsWith(github.ref_name, 'desktop-v')
    environment: desktop-release-signing
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 90
    steps:
      - name: Install Fedora runner prerequisites
        run: >-
          dnf install -y git findutils gcc gcc-c++ openssl-devel openssl
          webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel
          procps-ng rpm-build file patchelf tar gzip xz xorg-x11-server-Xvfb xorg-x11-xauth gh jq

      - name: Checkout exact current source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Prove first-release bootstrap boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/desktop-v" --jq '.[].ref' | sort > desktop-release-refs.txt
          test "$(wc -l < desktop-release-refs.txt | tr -d ' ')" -eq 1
          test "$(cat desktop-release-refs.txt)" = "refs/tags/$GITHUB_REF_NAME"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].assets[].name' | sort > desktop-release-assets.txt
          if grep -Eiq '\.(msi|pkg|deb|rpm)$' desktop-release-assets.txt; then
            echo "A prior installer-managed desktop host exists; bootstrap fixture is invalid" >&2
            exit 1
          fi

      - name: Configure Linux installed-identity signing
        shell: bash
        env:
          PRIVATE_KEY_PEM: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PRIVATE_KEY_PEM }}
          PUBLIC_KEY_PEM: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PUBLIC_KEY_PEM }}
          PUBLIC_KEY_HEX: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PUBLIC_KEY_HEX }}
          PREVIOUS_PUBLIC_KEY_PEM: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_PEM }}
          PREVIOUS_PRIVATE_KEY_PEM: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PREVIOUS_PRIVATE_KEY_PEM }}
          PREVIOUS_PUBLIC_KEY_HEX: ${{ secrets.ANIMA_LINUX_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_HEX }}
        run: |
          test -n "$PRIVATE_KEY_PEM"
          test -n "$PUBLIC_KEY_PEM"
          test -n "$PUBLIC_KEY_HEX"
          test -n "$PREVIOUS_PUBLIC_KEY_PEM"
          test -n "$PREVIOUS_PRIVATE_KEY_PEM"
          test -n "$PREVIOUS_PUBLIC_KEY_HEX"
          : > "$RUNNER_TEMP/anima-install-identity-private.pem"
          : > "$RUNNER_TEMP/anima-install-identity-public.pem"
          : > "$RUNNER_TEMP/anima-install-identity-previous-public.pem"
          : > "$RUNNER_TEMP/anima-install-identity-previous-private.pem"
          printf '%s' "$PRIVATE_KEY_PEM" > "$RUNNER_TEMP/anima-install-identity-private.pem"
          printf '%s' "$PUBLIC_KEY_PEM" > "$RUNNER_TEMP/anima-install-identity-public.pem"
          printf '%s' "$PREVIOUS_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/anima-install-identity-previous-public.pem"
          printf '%s' "$PREVIOUS_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/anima-install-identity-previous-private.pem"
          chmod 600 "$RUNNER_TEMP/anima-install-identity-private.pem" "$RUNNER_TEMP/anima-install-identity-previous-private.pem"
          test "$PUBLIC_KEY_HEX" != "$PREVIOUS_PUBLIC_KEY_HEX"
          echo "ANIMA_INSTALL_IDENTITY_PRIVATE_KEY=$RUNNER_TEMP/anima-install-identity-private.pem" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PUBLIC_KEY_PEM=$RUNNER_TEMP/anima-install-identity-public.pem" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_PEM=$RUNNER_TEMP/anima-install-identity-previous-public.pem" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PREVIOUS_PRIVATE_KEY=$RUNNER_TEMP/anima-install-identity-previous-private.pem" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_HEX=$PREVIOUS_PUBLIC_KEY_HEX" >> "$GITHUB_ENV"
          echo "ANIMA_INSTALL_IDENTITY_PUBLIC_KEY_HEX=$PUBLIC_KEY_HEX" >> "$GITHUB_ENV"

      - name: Install current dependencies
        run: bun install --frozen-lockfile

      - name: Validate protected release and predecessor versions
        env:
          FIXTURE_VERSION: ${{ inputs.fixture_version }}
        run: |
          current_version=$(bun -e 'console.log(JSON.parse(await Bun.file("apps/desktop/src-tauri/tauri.conf.json").text()).version)')
          test "$GITHUB_REF_NAME" = "desktop-v$current_version"
          CURRENT_VERSION="$current_version" bun -e 'if (Bun.semver.order(process.env.FIXTURE_VERSION, process.env.CURRENT_VERSION) >= 0) process.exit(1)'

      - name: Build unpublished predecessor RPM from the same protected source
        env:
          ANIMA_DESKTOP_VERSION_OVERRIDE: ${{ inputs.fixture_version }}
          ANIMA_DRAFT_CLEANUP_LEGACY_FIXTURE: "1"
        run: |
          export ANIMA_INSTALL_IDENTITY_PRIVATE_KEY="$ANIMA_INSTALL_IDENTITY_PREVIOUS_PRIVATE_KEY"
          export ANIMA_INSTALL_IDENTITY_PUBLIC_KEY_HEX="$ANIMA_INSTALL_IDENTITY_PREVIOUS_PUBLIC_KEY_HEX"
          bun run --cwd apps/desktop package:rpm
          find target -name '*.rpm' -type f > previous-artifact-candidates.txt
          test "$(wc -l < previous-artifact-candidates.txt | tr -d ' ')" -eq 1
          previous="$RUNNER_TEMP/anima-predecessor.rpm"
          mv "$(cat previous-artifact-candidates.txt)" "$previous"
          printf '%s\n' "$previous" > previous-artifact.txt

      - name: Build exact signed current RPM
        run: bun run --cwd apps/desktop package:rpm

      - name: Locate exactly one final RPM per version
        run: |
          find target -name '*.rpm' -type f > current-artifact.txt
          test "$(wc -l < current-artifact.txt | tr -d ' ')" -eq 1

      - name: Install replacement and inspect RPM registrations
        run: >-
          bun run scripts/verify-desktop-release-contract.ts
          --platform rpm
          --previous-artifact "$(cat previous-artifact.txt)"
          --artifact "$(cat current-artifact.txt)"
          --output artifact-digests

      - name: Native launch gate, boot identity, and process census primitives
        run: cargo test -p desktop --test draft_cleanup_process

      - name: Strict native authority lint
        run: cargo clippy -p desktop --all-targets -- -D warnings

      - name: Collect verified final RPM
        run: cp "$(cat current-artifact.txt)" artifact-digests/

      - name: Upload verified RPM and evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-anima-rpm
          path: artifact-digests
          if-no-files-found: error
