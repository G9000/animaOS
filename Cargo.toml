[workspace]
resolver = "2"
members = [
    "packages/anima-core",
    "apps/local-runtime-daemon",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.75.0"
license = "MIT"
repository = "https://github.com/G9000/animaOS"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7" }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "process", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
bincode = { version = "2.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.0.18", features = ["env-filter", "fmt"] }
blake3 = "1.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
