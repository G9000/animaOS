[package]
name = "anima-corefs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical cryptographic and filesystem primitives for ANIMA CORE."

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
# These exact crypto-graph pins preserve the workspace's Rust 1.75 MSRV.
base64ct = "=1.6.0"
cap-fs-ext = "3.4.5"
cap-std = "3.4.5"
fs4 = "0.8"
getrandom = "0.2"
hkdf = "0.12"
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
unicode-normalization = "0.1"
zeroize = { version = "=1.8.1", features = ["zeroize_derive"] }
zeroize_derive = "=1.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
winx = "0.36.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hex = "0.4"
